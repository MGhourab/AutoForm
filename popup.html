<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoForm Fill</title>

<style>
body{
    font-family:Arial,sans-serif;
    width:320px;
    padding:10px;
    box-sizing:border-box;
}

h3{
    margin-top:0;
}

input,
button{
    width:100%;
    margin:4px 0;
    box-sizing:border-box;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    margin-top:6px;
}

.status{
    font-weight:bold;
    color:#c62828;
    min-width:18px;
    text-align:right;
}
</style>
</head>

<body>

<h3>AutoForm Fill</h3>

<label for="fixed">Fixed Value</label>
<input id="fixed">

<label for="start">Start</label>
<input id="start" type="number" value="1">

<label for="end">End</label>
<input id="end" type="number" value="100">

<label for="step">Step</label>
<input id="step" type="number" value="1">

<hr>

<div class="row">
    <span>Fixed</span>
    <span id="sf" class="status">❌</span>
</div>
<button id="pf">Select Fixed Field</button>

<div class="row">
    <span>Number</span>
    <span id="sn" class="status">❌</span>
</div>
<button id="pn">Select Number Field</button>

<div class="row">
    <span>Submit</span>
    <span id="ss" class="status">❌</span>
</div>
<button id="ps">Select Submit Button</button>

<hr>

<button id="startBtn">Start</button>
<button id="stopBtn">Stop</button>

<script src="popup.js"></script>

</body>
</html>
